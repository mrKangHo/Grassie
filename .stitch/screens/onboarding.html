                        "outline": "#6d7b68",

                    fontFamily: {

<style>
        .glass-panel {
            background-color: rgba(250, 249, 254, 0.05);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
        }
        
        .glow-effect {
            box-shadow: 0 0 40px rgba(75, 226, 87, 0.2);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-inverse-surface text-surface h-screen w-screen flex items-center justify-center overflow-hidden relative">
<!-- Atmospheric background elements -->
<div class="absolute top-[-20%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary/10 blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-secondary/10 blur-[120px] pointer-events-none"></div>
<!-- Main Onboarding Container -->
<div class="glass-panel rounded-xl p-8 max-w-md w-full mx-container-padding flex flex-col items-center text-center relative z-10 shadow-2xl">
<!-- Hero Graphic (Grid representation) -->
<div class="mb-8 relative glow-effect rounded-lg p-4 bg-inverse-surface/50 border border-outline-variant/20">
<div class="grid grid-cols-5 gap-grid-gap p-1">
<!-- Row 1 -->
<div class="w-grid-node h-grid-node rounded-sm bg-surface-variant/20"></div>
<div class="w-grid-node h-grid-node rounded-sm bg-primary-fixed-dim/40"></div>
<div class="w-grid-node h-grid-node rounded-sm bg-primary-fixed/60"></div>
<div class="w-grid-node h-grid-node rounded-sm bg-surface-variant/20"></div>
<div class="w-grid-node h-grid-node rounded-sm bg-primary-container/80"></div>
<!-- Row 2 -->
<div class="w-grid-node h-grid-node rounded-sm bg-primary-fixed/60"></div>
<div class="w-grid-node h-grid-node rounded-sm bg-surface-variant/20"></div>
<div class="w-grid-node h-grid-node rounded-sm bg-primary-fixed-dim/40"></div>
<div class="w-grid-node h-grid-node rounded-sm bg-primary-container/80"></div>
<div class="w-grid-node h-grid-node rounded-sm bg-primary"></div>
<!-- Row 3 -->
<div class="w-grid-node h-grid-node rounded-sm bg-surface-variant/20"></div>
<div class="w-grid-node h-grid-node rounded-sm bg-primary-container/80"></div>
<div class="w-grid-node h-grid-node rounded-sm bg-primary"></div>
<div class="w-grid-node h-grid-node rounded-sm bg-primary-fixed/60"></div>
<div class="w-grid-node h-grid-node rounded-sm bg-surface-variant/20"></div>
</div>
<!-- Central Icon Overlay -->
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-primary-fixed text-4xl drop-shadow-[0_0_15px_rgba(75,226,87,0.8)]" style="font-variation-settings: 'FILL' 1;">
                    energy_savings_leaf
                </span>
</div>
</div>
<!-- Typography -->
<h1 class="font-display text-display text-surface mb-stack-gap-sm">
            Welcome to GrassTracker
        </h1>
<p class="font-body text-body text-surface-dim mb-8 px-4">
            Track your open-source contributions right from your menu bar.
        </p>
<!-- Actions -->
<div class="w-full flex flex-col gap-stack-gap-md">
<button class="w-full py-3 px-4 bg-primary text-on-primary rounded-lg font-body-bold text-body-bold flex items-center justify-center gap-2 hover:bg-primary/90 transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-lg">code</span>
                Connect GitHub
            </button>
<button class="w-full py-2 px-4 text-surface-dim hover:text-surface font-body text-body transition-colors rounded-lg hover:bg-surface/5 active:bg-surface/10">
                Skip for now
            </button>
</div>
</div>
