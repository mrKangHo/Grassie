<style>
        .glass-panel {
            background: rgba(26, 27, 31, 0.7);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 0.5px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .grass-0 { background-color: rgba(255,255,255,0.05); }
        .grass-1 { background-color: #004d0f; }
        .grass-2 { background-color: #006e1a; }
        .grass-3 { background-color: #28c840; }
        .grass-4 { background-color: #71ff74; }
        
        .grid-container {
            display: grid;
            grid-template-rows: repeat(7, 10px);
            grid-auto-flow: column;
            gap: 3px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-transparent flex items-start justify-center min-h-screen p-4 pt-10 font-body text-body text-surface">
<!-- Popover Container -->
<div class="glass-panel w-[380px] rounded-xl overflow-hidden flex flex-col relative mt-2 before:content-[''] before:absolute before:-top-2 before:left-1/2 before:-translate-x-1/2 before:border-[8px] before:border-transparent before:border-b-[rgba(26,27,31,0.7)]">
<!-- TopAppBar Shared Component logic applied manually -->
<header class="bg-surface/10 dark:bg-surface-dim/20 backdrop-blur-xl w-full sticky top-0 border-b border-outline-variant/20 shadow-sm flex items-center justify-between px-container-padding h-12">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">grid_view</span>
<h1 class="font-headline text-headline font-bold text-surface">GrassTracker</h1>
</div>
<button class="text-on-surface-variant hover:bg-on-surface-variant/20 hover:text-surface transition-colors p-1.5 rounded-lg active:scale-95 duration-100 flex items-center justify-center">
<span class="material-symbols-outlined text-[18px]">settings</span>
</button>
</header>
<main class="p-container-padding flex flex-col gap-stack-gap-md">
<!-- Summary Stats -->
<div class="flex gap-4">
<div class="flex-1 bg-surface-container-highest/30 border border-outline-variant/10 rounded-lg p-3 flex flex-col gap-1">
<span class="font-caption text-caption text-surface-dim/80">Current Streak</span>
<div class="flex items-baseline gap-1">
<span class="font-display text-display text-surface">15</span>
<span class="font-caption text-caption text-surface-dim/60">days</span>
</div>
</div>
<div class="flex-1 bg-surface-container-highest/30 border border-outline-variant/10 rounded-lg p-3 flex flex-col gap-1">
<span class="font-caption text-caption text-surface-dim/80">Total Contributions</span>
<div class="flex items-baseline gap-1">
<span class="font-display text-display text-surface">1,240</span>
</div>
</div>
</div>
<!-- Contribution Grid -->
<div class="flex flex-col gap-3">
<div class="flex items-center justify-between">
<h2 class="font-body-bold text-body-bold text-surface">Last 12 Months</h2>
<span class="font-mono-label text-mono-label text-surface-dim/60">Oct 2022 - Oct 2023</span>
</div>
<div class="overflow-x-auto pb-2 custom-scrollbar">
<div class="grid-container w-max" id="contribution-grid">
<!-- Grid cells will be generated by JS -->
</div>
</div>
<!-- Legend -->
<div class="flex items-center justify-end gap-2 text-surface-dim/60 font-caption text-caption mt-1">
<span>Less</span>
<div class="flex gap-1">
<div class="w-[10px] h-[10px] rounded-[2px] grass-0 border border-white/5"></div>
<div class="w-[10px] h-[10px] rounded-[2px] grass-1 border border-white/5"></div>
<div class="w-[10px] h-[10px] rounded-[2px] grass-2 border border-white/5"></div>
<div class="w-[10px] h-[10px] rounded-[2px] grass-3 border border-white/5"></div>
<div class="w-[10px] h-[10px] rounded-[2px] grass-4 border border-white/5"></div>
</div>
<span>More</span>
</div>
</div>
</main>
<!-- Footer -->
<footer class="border-t border-outline-variant/20 bg-surface-container-highest/20 p-container-padding flex items-center justify-between">
<button class="flex items-center gap-1 text-surface-dim hover:text-surface transition-colors group">
<span class="material-symbols-outlined text-[16px] group-hover:rotate-180 transition-transform duration-500">refresh</span>
<span class="font-caption text-caption">Updated just now</span>
</button>
<button class="font-body-bold text-body-bold text-secondary-fixed-dim hover:text-secondary-fixed transition-colors flex items-center gap-1">
                View Full Stats
                <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</footer>
</div>
<script>
        // Generate random grid data
        const gridContainer = document.getElementById('contribution-grid');
        const weeks = 40; // Fit well in the popover width
        const days = 7;
        
        for (let i = 0; i < weeks * days; i++) {
            const cell = document.createElement('div');
            
            // Randomly assign a grass level, heavily weighted towards 0
            const rand = Math.random();
            let level = 0;
            if (rand > 0.95) level = 4;
            else if (rand > 0.85) level = 3;
            else if (rand > 0.7) level = 2;
            else if (rand > 0.5) level = 1;
            
            cell.className = `w-[10px] h-[10px] rounded-[2px] grass-${level} border border-white/5 hover:border-white/40 transition-colors cursor-crosshair`;
            cell.title = `${Math.floor(Math.random() * 15)} contributions on specific date`;
            gridContainer.appendChild(cell);
        }
    </script>
</body></html>
